name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Run web tests
        run: npm test

      - name: Check repository
        run: npm run check

      - name: Build ESP8266 firmware
        run: pio run -e nodemcuv2

      - name: Build LittleFS image
        run: pio run -e nodemcuv2 -t buildfs

      - name: Test controller core
        run: pio test -e native
